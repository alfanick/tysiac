[workspace]
resolver = "2"
members = [
    "crates/cards",
    "crates/tysiac",
    "crates/protocol",
    "crates/i18n",
    "apps/game-server",
    "apps/web-server",
    "apps/web-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1.0"
askama = "0.16"
axum = { version = "0.8", features = ["json", "ws"] }
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
http = "1.3"
rand_chacha = "0.9"
rand_core = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["full", "test-util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2.1"
uuid = { version = "1.18", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
